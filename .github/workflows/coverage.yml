
name: Coverage workflow

# Manual запуск через GitHub Actions
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Who starts the workflow'
        default: 'Executer'
        required: true
        type: string

permissions:
  contents: read

jobs:
  coverage:
    name: Run tests and get coverage
    runs-on: ubuntu-latest

    steps:
      # Завантаження коду репозиторію
      - name: Checkout repository
        uses: actions/checkout@v7

      # Налаштування Python
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # Встановлення необхідних пакетів
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest coverage

      # Запуск тестів та збір покриття
      - name: Run tests with coverage
        working-directory: example/coverage_io
        run: |
          python -m coverage run --source=app -m pytest test.py -v

      # Генерація звіту XML
      - name: Generate coverage report
        working-directory: example/coverage_io
        run: |
          python -m coverage xml -o coverage.xml
          python -m coverage report

      # Завантаження звіту в Codecov
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: example/coverage_io/coverage.xml
          fail_ci_if_error: true
          verbose: true
