
name: Coverage workflow

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Who starts the workflow'
        default: 'Executer'
        required: true
        type: string

permissions:
  contents: read

jobs:
  coverage:
    name: Run tests and get coverage
    runs-on: ubuntu-latest

    steps:
      # Завантаження коду
      - name: Checkout repository
        uses: actions/checkout@v4

      # Налаштування Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Встановлення бібліотек
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest coverage codecov-cli

      # Запуск тестів із вимірюванням покриття
      - name: Run tests with coverage
        working-directory: example/coverage_io
        run: |
          python -m coverage run --source=app -m pytest test.py -v

      # Створення XML-звіту
      - name: Generate coverage report
        working-directory: example/coverage_io
        run: |
          python -m coverage xml -o coverage.xml
          python -m coverage report

      # Завантаження звіту в Codecov
      - name: Upload Coverage to Codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          codecovcli --auto-load-params-from GithubActions --verbose upload-process --disable-search --fail-on-error --file example/coverage_io/coverage.xml
