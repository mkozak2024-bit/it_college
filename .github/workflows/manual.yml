
# This is a workflow that can be manually triggered

name: Manual workflow

# Запуск вручну через GitHub Actions
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Person to greet'
        default: 'Executer'
        required: true
        type: string

jobs:
  # Перше завдання — привітання
  greet:
    name: Simple manual trigger
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10"]

    steps:
      - uses: actions/checkout@v4

      - name: Send greeting
        run: echo "Hello ${{ github.event.inputs.name }}"

      - name: Set-up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
        if: github.event.inputs.name != 'Executer'

      - name: Get Python Version
        if: github.event.inputs.name != 'Executer'
        run: |
          python --version
          python -c 'import datetime; print(f"This Workflow start at: {datetime.datetime.now()}")'

  # Друге завдання — прощання
  goodbye:
    name: Say goodbye
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10"]

    steps:
      - uses: actions/checkout@v4

      - name: Say goodbye
        if: github.event.inputs.name == 'Executer'
        run: echo "Goodbye ${{ github.event.inputs.name }}"

  # Третє завдання — запуск інтеграційних тестів
  tests:
    name: Run integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flask pytest

      - name: Run integration tests
        run: |
          python -m pytest example/testing/04_integration_testing/test_app.py -v
