
# Workflow для автоматичного запуску за розкладом

name: Cron workflow

on:
  # Можливість ручного запуску
  workflow_dispatch:

  # Автоматичний запуск щопонеділка о 08:00 UTC
  schedule:
    - cron: '0 8 * * 1'

jobs:
  tests:
    name: Run scheduled integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install flask pytest

      - name: Run integration tests
        run: |
          python -m pytest example/testing/04_integration_testing/test_app.py -v
